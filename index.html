<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muz Bacak Avı</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #fff; font-family: Arial, sans-serif; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #centerDot { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0.8; }
    #topLeft { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.45); padding: 8px 12px; border-radius: 8px; }
    #start {
      position: fixed; inset: 0; display: grid; place-items: center;
      background: rgba(0,0,0,0.8); cursor: pointer;
    }
    #startBox { text-align: center; max-width: 540px; padding: 24px; background: #1d1d1d; border-radius: 12px; border: 1px solid #333; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="topLeft">Skor: <span id="score">0</span><br>Canlı İnsan: <span id="alive">0</span></div>
    <div id="centerDot"></div>
  </div>
  <div id="start"><div id="startBox">
    <h1>Muz Bacak Avı</h1>
    <p><b>WASD</b> ile yürü, <b>Mouse</b> ile etrafa bak, <b>Space</b> ile muzla vur.</p>
    <p>Başlamak için tıkla (pointer lock).</p>
  </div></div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 300);
    camera.position.set(0, 1.7, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.1));
    const sun = new THREE.DirectionalLight(0xffffff, 1.0);
    sun.position.set(8, 12, 6);
    scene.add(sun);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshStandardMaterial({ color: 0x2d8f43 }));
    floor.rotation.x = -Math.PI/2;
    scene.add(floor);

    const keys = { w:false, a:false, s:false, d:false };
    let yaw = 0, pitch = 0;
    const moveSpeed = 7;

    const start = document.getElementById('start');
    start.addEventListener('click', () => renderer.domElement.requestPointerLock());
    document.addEventListener('pointerlockchange', () => {
      start.style.display = document.pointerLockElement ? 'none' : 'grid';
    });

    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement !== renderer.domElement) return;
      yaw -= e.movementX * 0.0022;
      pitch -= e.movementY * 0.0022;
      pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, pitch));
    });

    document.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = true;
      if (e.code === 'Space') swingBanana();
    });
    document.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k in keys) keys[k] = false;
    });

    const people = [];
    const personRoot = new THREE.Group();
    scene.add(personRoot);

    function createPerson() {
      const g = new THREE.Group();

      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.0, 0.35), new THREE.MeshStandardMaterial({ color: 0x4b8cff }));
      torso.position.y = 1.3;
      g.add(torso);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), new THREE.MeshStandardMaterial({ color: 0xf2c9a5 }));
      head.position.y = 2.0;
      g.add(head);

      const legGeo = new THREE.BoxGeometry(0.22, 0.95, 0.22);
      const legMat = new THREE.MeshStandardMaterial({ color: 0x202020 });
      const leftLeg = new THREE.Mesh(legGeo, legMat);
      const rightLeg = new THREE.Mesh(legGeo, legMat);
      leftLeg.position.set(-0.18, 0.5, 0);
      rightLeg.position.set(0.18, 0.5, 0);
      g.add(leftLeg, rightLeg);

      g.position.set((Math.random()-0.5)*80, 0, (Math.random()-0.5)*80);
      g.userData = { alive: true, t: Math.random()*100, leftLeg, rightLeg };
      personRoot.add(g);
      people.push(g);
    }

    for (let i=0;i<18;i++) createPerson();

    let score = 0;
    const scoreEl = document.getElementById('score');
    const aliveEl = document.getElementById('alive');

    function swingBanana() {
      if (document.pointerLockElement !== renderer.domElement) return;
      const fwd = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
      const origin = camera.position.clone();

      let best = null;
      let bestDist = 2.5;

      for (const p of people) {
        if (!p.userData.alive) continue;
        const legTargets = [p.userData.leftLeg, p.userData.rightLeg];
        for (const leg of legTargets) {
          const w = leg.getWorldPosition(new THREE.Vector3());
          const to = w.clone().sub(origin);
          const proj = to.dot(fwd);
          if (proj < 0 || proj > bestDist) continue;
          const off = to.clone().sub(fwd.clone().multiplyScalar(proj)).length();
          if (off < 0.38) {
            best = p;
            bestDist = proj;
          }
        }
      }

      if (best) {
        best.userData.alive = false;
        best.visible = false;
        score += 1;
        scoreEl.textContent = String(score);
      }
    }

    const clock = new THREE.Clock();
    let spawnTimer = 0;

    function animate() {
      const dt = Math.min(0.05, clock.getDelta());
      camera.rotation.set(pitch, yaw, 0, 'YXZ');

      const dir = new THREE.Vector3();
      if (keys.w) dir.z -= 1;
      if (keys.s) dir.z += 1;
      if (keys.a) dir.x -= 1;
      if (keys.d) dir.x += 1;
      if (dir.lengthSq() > 0) {
        dir.normalize().applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
        camera.position.addScaledVector(dir, moveSpeed * dt);
      }
      camera.position.y = 1.7;

      for (const p of people) {
        if (!p.userData.alive) continue;
        p.userData.t += dt;
        const wobble = Math.sin(p.userData.t * 5) * 0.15;
        p.userData.leftLeg.rotation.x = wobble;
        p.userData.rightLeg.rotation.x = -wobble;
        p.rotation.y += dt * 0.8;
      }

      spawnTimer += dt;
      if (spawnTimer > 1.25) {
        spawnTimer = 0;
        const aliveCount = people.filter(p => p.userData.alive).length;
        if (aliveCount < 30) createPerson();
      }

      aliveEl.textContent = String(people.filter(p => p.userData.alive).length);
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
